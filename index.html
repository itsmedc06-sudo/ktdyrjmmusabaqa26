    let selectedDay = '2026-10-03';
    let selectedStage = 'all';

    function formatTime12(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hours = h % 12 || 12;
      return `${hours}:${m.toString().padStart(2, '0')} ${ampm}`;
    }

    function switchDay(day) {
      selectedDay = day;
      const tabs = document.querySelectorAll('.day-tab');
      tabs[0].classList.toggle('active', day === '2026-10-03');
      tabs[1].classList.toggle('active', day === '2026-10-04');
      renderSchedule();
    }

    function switchStage(stage) {
      selectedStage = stage;
      document.querySelectorAll('.stage-btn').forEach(btn => {
        const text = btn.innerText;
        if (stage === 'all' && text.includes('ALL')) btn.classList.add('active');
        else if (stage !== 'all' && text.includes(`STAGE 0${stage}`)) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      renderSchedule();
    }

    function renderSchedule() {
      const timeline = document.getElementById('scheduleTimeline');
      const query = document.getElementById('liveSearch').value.trim().toLowerCase();
      const now = new Date();

      const matched = scheduleData.filter(item => {
        const matchesDay = item.day === selectedDay;
        const matchesStage = selectedStage === 'all' || item.stage === selectedStage;
        const matchesQuery = item.title.toLowerCase().includes(query) ||
                             item.catLabel.toLowerCase().includes(query) ||
                             `stage ${item.stage}`.includes(query);
        return matchesDay && matchesStage && matchesQuery;
      });

      if (matched.length === 0) {
        timeline.innerHTML = `<div style="text-align:center; padding: 45px 15px; color:#64748b; font-size:14px;">No programs found matching your search.</div>`;
        return;
      }

      timeline.innerHTML = matched.map(ev => {
        const [sH, sM] = ev.start.split(':').map(Number);
        const [eH, eM] = ev.end.split(':').map(Number);
        const [y, m, d] = ev.day.split('-').map(Number);

        const startObj = new Date(y, m - 1, d, sH, sM, 0);
        const endObj = new Date(y, m - 1, d, eH, eM, 0);

        const isLive = now >= startObj && now <= endObj;
        const isPast = now > endObj;

        let statusClass = '';
        if (isLive) statusClass = 'live';
        else if (isPast) statusClass = 'past';

        if (ev.isBreak) {
          return `
            <div class="event-card break-card ${statusClass}">
              <div class="time-range">${formatTime12(ev.start)} – ${formatTime12(ev.end)}</div>
              <div class="event-title" style="margin-top: 4px;">☕ ${ev.title}</div>
            </div>
          `;
        }

        return `
          <div class="event-card ${statusClass}">
            <div class="card-top">
              <span class="stage-tag">STAGE 0${ev.stage}</span>
              <span class="time-range">${formatTime12(ev.start)} – ${formatTime12(ev.end)}</span>
            </div>
            <div class="event-title">${ev.title}</div>
            <div class="card-bottom">
              <span class="cat-pill cat-${ev.catKey}">${ev.catLabel}</span>
              ${isLive ? `<span class="live-badge"><span class="live-dot"></span> LIVE NOW</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    setInterval(renderSchedule, 30000);
    renderSchedule();
  </script>
